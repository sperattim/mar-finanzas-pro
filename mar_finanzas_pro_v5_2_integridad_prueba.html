const LOCAL_KEY = 'mar_finanzas_pro_limpia_v1';
const VAULT_KEY = 'mar_finanzas_pro_vault_v4';
let vaultKey = null, vaultLocked = true, vaultClosing = false, vaultQueue = Promise.resolve(), vaultGeneration = 0;
let vaultSaveError = null;
function vaultPayload(){ return JSON.stringify({items:[...items],boda:[...boda],settings}); }
function applyVaultPayload(raw){
  const d=JSON.parse(raw);
  if(!Array.isArray(d.items)||!Array.isArray(d.boda)||!d.settings||typeof d.settings!=='object') throw Error('Datos inválidos');
  items.clear(); boda.clear(); for(const [id,v] of d.items) items.set(id,v);
  for(const [id,v] of d.boda) boda.set(id,v); settings=d.settings;
}
async function vaultDerive(pass,salt){
  const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function vaultEncrypt(key,raw,salt){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const data=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(raw));
  return JSON.stringify({format:'mar-finanzas-vault',version:1,iterations:600000,salt:bytes64(salt),iv:bytes64(iv),data:bytes64(new Uint8Array(data))});
}
async function vaultDecrypt(key,env){
  const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:from64(env.iv)},key,from64(env.data));
  return new TextDecoder().decode(raw);
}
function vaultEnvelope(){
  const raw=localStorage.getItem(VAULT_KEY); if(!raw) return null;
  const env=JSON.parse(raw);
  if(env.format!=='mar-finanzas-vault'||env.version!==1||env.iterations!==600000||from64(env.salt).length!==16||from64(env.iv).length!==12) throw Error('Bóveda dañada');
  return env;
}
function saveLocal(){
  if(vaultLocked||vaultClosing||!vaultKey) return Promise.reject(Error('La bóveda está bloqueada'));
  const snapshot=vaultPayload(), generation=vaultGeneration;
  const job=vaultQueue.then(async()=>{
    if(generation!==vaultGeneration||vaultLocked) throw Error('Sesión cerrada antes de guardar');
    const env=vaultEnvelope();
    const encrypted=await vaultEncrypt(vaultKey,snapshot,from64(env.salt));
    if(generation!==vaultGeneration||vaultLocked) throw Error('Sesión cerrada antes de guardar');
    localStorage.setItem(VAULT_KEY,encrypted);
    vaultSaveError=null;
  });
  vaultQueue=job.catch(e=>{vaultSaveError=e;});
  return job.catch(e=>{alert('No se pudo guardar el cambio cifrado: '+e.message);throw e;});
}
// Serializa mutaciones: una operación fallida no deja el estado visible sin guardar.
let mutationQueue = Promise.resolve();
function commitMutation(change){
  const session=vaultGeneration;
  const work=mutationQueue.then(async()=>{
    if(vaultLocked||vaultClosing||!vaultKey||session!==vaultGeneration) throw Error('La bóveda está bloqueada');
    // Tomar el estado confirmado antes de modificarlo.
    await vaultQueue;
    if(vaultSaveError) throw Error('Hay un error de guardado pendiente. Cerrá y volvé a abrir la bóveda.');
    if(vaultLocked||vaultClosing||session!==vaultGeneration) throw Error('La sesión cambió');
    const before=vaultPayload();
    try {
      change();
      await saveLocal();
    } catch(e){
      if(!vaultLocked && !vaultClosing && session===vaultGeneration){
        applyVaultPayload(before);
        render();
      }
      throw e;
    }
  });
  mutationQueue=work.catch(()=>{});
  return work;
}

  const pass=document.createElement('input');pass.type='password';pass.placeholder='Contraseña';pass.autocomplete='off';pass.style.cssText='width:100%;padding:12px;margin:8px 0;border:1px solid #aaa;border-radius:8px;color:#111;background:white';

  const isNew=!localStorage.getItem(VAULT_KEY);if(!isNew)confirmPass.hidden=true;
  const btn=document.createElement('button');btn.textContent=isNew?'Crear bóveda cifrada':'Desbloquear';btn.style.cssText='background:#1c5d86;color:white;padding:12px;border:0;border-radius:8px;width:100%;margin-top:8px;font-weight:bold';
  const error=document.createElement('p');error.style.color='#b0392f';

  btn.onclick=async()=>{
    btn.disabled=true;error.textContent='';
    try{
       if(vaultClosing) throw Error('Terminando de guardar. Esperá un momento y volvé a intentar.');
      if(!window.isSecureContext||!crypto.subtle)throw Error('Abrí la app desde HTTPS.');
      if(isNew){
        if(pass.value.length<12)throw Error('Usá al menos 12 caracteres.');
        if(pass.value!==confirmPass.value)throw Error('Las contraseñas no coinciden.');
        if(!confirm('Antes de migrar: ¿ya guardaste y probaste un respaldo .mfin de tus movimientos ficticios?'))return;
        const legacy=localStorage.getItem(LOCAL_KEY);
        const salt=crypto.getRandomValues(new Uint8Array(16));
        const key=await vaultDerive(pass.value,salt);
        if(legacy) applyVaultPayload(legacy);
        const encrypted=await vaultEncrypt(key,vaultPayload(),salt);
        localStorage.setItem(VAULT_KEY,encrypted); // Escribir y verificar antes de eliminar el original
        const verify=await vaultDecrypt(key,vaultEnvelope());JSON.parse(verify);
        localStorage.removeItem(LOCAL_KEY); localStorage.removeItem('fin:origen');
        vaultKey=key;
      }else{
        const env=vaultEnvelope();const key=await vaultDerive(pass.value,from64(env.salt));
        let raw;try{raw=await vaultDecrypt(key,env);}catch{throw Error('Contraseña incorrecta o datos dañados.');}
        applyVaultPayload(raw);vaultKey=key;
      }
      vaultLocked=false;vaultClosing=false;vaultSaveError=null;vaultGeneration++;overlay.remove();

async function lockVault(){
  if(vaultLocked || vaultClosing)return;
  // Ocultar datos inmediatamente, antes de esperar las escrituras cifradas.
  vaultClosing=true;
  cancelAnimationFrame(raf);
  const view=document.getElementById('view'); if(view) view.replaceChildren();
  const dialog=document.getElementById('dlg'); if(dialog?.open) dialog.close();
  const fab=document.getElementById('fab'); if(fab) fab.hidden=true;
  showVault('Bóveda bloqueada. Terminando guardados pendientes si los hay…');
  try {
    await mutationQueue;
    await vaultQueue;
  } finally {
    vaultLocked=true;vaultClosing=false;vaultGeneration++;vaultKey=null;
    items.clear();boda.clear();settings={};loaded=false;
    showVault(vaultSaveError ? 'Bóveda bloqueada. ATENCIÓN: el último cambio podría no haberse guardado. Revisá tus datos y tu respaldo.' : 'Bóveda bloqueada. Ingresá tu contraseña para continuar.');
  }
}

function newId(){ return 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
async function withRetry(fn){
  try { return await fn(); }
  catch (e){
    if (e && (e.code === 'unavailable' || e.code === 'resource_exhausted')){ await new Promise(r => setTimeout(r, 700 + Math.random()*900)); return fn(); }
    throw e;
  }
}
async function saveItem(id, data){
  if(vaultClosing || vaultLocked) throw Error('La bóveda está bloqueada');
  if (persistent){ const ref = id ? itemsCol.doc(id) : itemsCol.doc(); await withRetry(() => ref.set(data)); }
  else { await commitMutation(()=>items.set(id || newId(), data)); render(); }
}
async function deleteItem(id){
  if(vaultClosing || vaultLocked) throw Error('La bóveda está bloqueada');
  if (persistent) await withRetry(() => itemsCol.doc(id).delete());
  else { await commitMutation(()=>items.delete(id)); render(); }
}
const isBoda = kind => SCHEMA[kind] && SCHEMA[kind].store === 'boda';
async function saveRec(kind, id, data){
  if(vaultClosing || vaultLocked) throw Error('La bóveda está bloqueada');
  if (!isBoda(kind)) return saveItem(id, data);
  if (persistent){ const ref = id ? bodaCol.doc(id) : bodaCol.doc(); await withRetry(() => ref.set(data)); }

}
async function deleteRec(kind, id){
  if(vaultClosing || vaultLocked) throw Error('La bóveda está bloqueada');
  if (!isBoda(kind)) return deleteItem(id);
  if (persistent) await withRetry(() => bodaCol.doc(id).delete());

async function saveSettings(patch){
  if(vaultClosing || vaultLocked) throw Error('La bóveda está bloqueada');
  if (persistent){ settings = {...settings, ...patch}; await withRetry(() => settingsRef.set(settings)); }
  else await commitMutation(()=>{settings={...settings,...patch};});
  render();
}
function dbError(e){
  if (e && e.code === 'quota_exceeded') return 'Se llenó el espacio de datos. Borrá movimientos viejos para seguir agregando.';
  if (e && e.code === 'invalid_argument') return 'No se pudo guardar: esta vista no tiene permiso para escribir.';
  return 'No se pudo guardar. Probá de nuevo.';
}

/* ---------- cálculos ---------- */
const tcUSD = () => num(settings.tc);
const acctLabel = a => a.cuenta || `${a.banco||''} ${a.moneda||''}`.trim();
const cardLabel = c => `${c.banco||''} ${c.tarjeta||''}`.trim();
const debtLabel = d => `${d.entidad||''} ${d.concepto||''}`.trim();
function movGs(m){
  if ((m.moneda||'PYG') === 'USD'){ const r = num(m.tc) > 1 ? num(m.tc) : tcUSD(); return r ? num(m.monto) * r : 0; }
  return num(m.monto);
}
function inCur(m, cur){
  if ((m.moneda||'PYG') === (cur||'PYG')) return num(m.monto);
  if ((cur||'PYG') === 'PYG') return movGs(m);
  return tcUSD() ? movGs(m) / tcUSD() : 0;
}
const after = (m, base) => !base || (m.fecha||'') > base;
function acctBalance(a, movs){
  const L = acctLabel(a); let s = num(a.saldo_inicial);
  for (const m of movs){
    if (!after(m, a.fecha_base)) continue;
    const v = inCur(m, a.moneda);
    if (m.tipo === 'Transferencia'){ if (m.origen === L) s -= v; if (m.destino === L) s += v; }
    else if (m.tipo === 'Ingreso'){ if ((m.destino || m.origen) === L) s += v; }
    else if (m.origen === L) s -= v;
  }
  return s;
}
function cardBalance(c, movs){
  const L = cardLabel(c); let s = num(c.saldo);
  for (const m of movs){
    if (!after(m, c.fecha_base)) continue;
    const v = inCur(m, c.moneda);
    if (m.tipo === 'Gasto' && m.origen === L) s += v;
    if ((m.tipo === 'Pago deuda' || m.tipo === 'Transferencia') && m.destino === L) s -= v;
  }
  return s;
}
function toGs(amount, cur){ if ((cur||'PYG') !== 'USD') return {gs:amount, usdSin:0}; const r = tcUSD(); return r ? {gs:amount*r, usdSin:0} : {gs:0, usdSin:amount}; }
function patrimonio(){
  const movs = list('mov'); const r = {liq:0, inv:0, tarj:0, prest:0, usdSin:0, terceros:0};
  for (const a of list('cuenta')){
    const b = acctBalance(a, movs);
    if (a.terceros){ r.terceros += toGs(b, a.moneda).gs; continue; }
    const g = toGs(b, a.moneda); r.liq += g.gs; r.usdSin += g.usdSin;
  }
  for (const i of list('inversion')){ const g = toGs(num(i.valor), i.moneda); r.inv += g.gs; r.usdSin += g.usdSin; }
  for (const c of list('tarjeta')){ const g = toGs(cardBalance(c, movs), c.moneda); r.tarj += g.gs; r.usdSin -= g.usdSin; }
  for (const d of list('deuda')){ const g = toGs(num(d.saldo), d.moneda); r.prest += g.gs; r.usdSin -= g.usdSin; }
  r.activos = r.liq + r.inv; r.pasivos = r.tarj + r.prest; r.neto = r.activos - r.pasivos;
  return r;
}

function bodaCalc(){
  const rubros = rubrosOrd(), its = blist('bitem'), ents = blist('entrega');
  const R = rubros.map(r => {
    const mine = its.filter(i => i.rubro === r.id);
    const pres = num(r.presupuesto);
    const asig = mine.reduce((s,i) => s + num(i.presupuesto), 0);
    const directo = mine.reduce((s,i) => s + num(i.pagado_directo), 0);
    const entregado = ents.filter(e => e.rubro === r.id).reduce((s,e) => s + num(e.monto), 0);
    const pagado = directo + entregado;
    const techo = Math.max(pres, asig);
    return {r, items: mine, pres, asig, directo, entregado, pagado, techo, falta: techo - pagado, sinAsignar: pres - asig};
  });
  const entregado = ents.reduce((s,e) => s + num(e.monto), 0);
  const viaOrg = its.filter(i => i.paga_saldo === 'Organizador');
  const aCargo = viaOrg.reduce((s,i) => s + Math.max(0, num(i.presupuesto) - num(i.pagado_directo)), 0);
  const pagadoOrg = viaOrg.reduce((s,i) => s + num(i.pagado_org), 0);
  const total = R.reduce((s,x) => s + x.techo, 0), pagado = R.reduce((s,x) => s + x.pagado, 0);
  return {R, ents, total, pagado, falta: total - pagado, sinPrecio: its.filter(i => !num(i.presupuesto)).length,
    org:{entregado, aCargo, pagadoOrg, enMano: entregado - pagadoOrg, faltaEntregar: aCargo - entregado}};
}

  const map = new Map(); const all = list('presupuesto');

  for (const p of sorted) if (num(p.limite) > 0 || p.mes === ym) map.set(p.categoria, {lim:num(p.limite), id: p.mes === ym ? p.id : null, mes:p.mes});

}
const FREQ = {mensual:1, bimestral:1/2, trimestral:1/3, semestral:1/6, anual:1/12, semanal:52/12};
function flujo(withAlt){
  const ing = list('ingreso');
  const altFuentes = new Set(ing.filter(i => /escenario/i.test(i.tipo||'')).map(i => i.fuente));
  let efectivo = 0, benef = 0; const used = [];
  for (const i of ing){
    const isAlt = /escenario/i.test(i.tipo||'');
    if (isAlt && !withAlt) continue;
    if (!isAlt && withAlt && altFuentes.has(i.fuente) && /^honorarios$/i.test(str(i.tipo))) continue;
    if (/pendiente/i.test(i.estado||'') && !isAlt) continue;
    if (/restringido/i.test(i.tipo||'')) benef += num(i.monto); else efectivo += num(i.monto);
    used.push(i.id);
  }
  let fijos = 0, loanInFijos = false;
  for (const r of list('recurrente')){
    const f = FREQ[norm(r.frecuencia)] ?? 1;
    fijos += (num(r.monto_pyg) + (tcUSD() ? num(r.monto_usd) * tcUSD() : 0)) * f;
    if (/pr[eé]stamo/i.test(r.concepto||'')) loanInFijos = true;
  }
  const cuotas = loanInFijos ? 0 : list('deuda').reduce((s,d) => s + num(d.cuota), 0);
  return {efectivo, benef, fijos, cuotas, loanInFijos, libre: efectivo + benef - fijos - cuotas, used:new Set(used)};
}

const uniqSorted = arr => [...new Set(arr.filter(Boolean))].sort((a,b) => a.localeCompare(b,'es'));
function byUse(values, uses){
  // ordena por cantidad de usos (más usados primero) y deja los no usados al final, en su orden
  const cnt = new Map(); for (const u of uses) if (u) cnt.set(u, (cnt.get(u)||0) + 1);
  const base = [...new Set(values.filter(Boolean))];
  return base.map((v,i) => [v, cnt.get(v)||0, i]).sort((a,b) => b[1]-a[1] || a[2]-b[2]).map(x => x[0]);
}
function options(src, f){

      const cuentas = list('cuenta').sort((a,b) => (a.terceros?1:0) - (b.terceros?1:0)).map(acctLabel);
      const tarjetas = list('tarjeta').map(cardLabel), deudas = list('deuda').map(debtLabel);
      return [...cuentas, ...tarjetas, ...deudas];
    }
    case 'cats': return uniqSorted([...movs.map(m => m.categoria), ...list('presupuesto').map(p => p.categoria), 'Alimentacion','Vivienda','Transporte','Salud','Belleza','Compras','Servicios','Ocio']);
    case 'subcats': return uniqSorted(movs.map(m => m.subcategoria));
    case 'estadosCobro': return uniqSorted([...list('cobro').map(c => c.estado), 'Por cobrar','Pendiente vencido','Facturado a crédito','Previsto','Cobrado']);

/* opciones según lo que ya está elegido en el formulario */
function optionsFor(kind, key, src, f){
  const movs = list('mov');
  if (kind === 'mov' && (key === 'origen' || key === 'destino')){
    const cuentas = list('cuenta').filter(a => !a.terceros).map(acctLabel);
    const terc = list('cuenta').filter(a => a.terceros).map(acctLabel);
    const tarjetas = list('tarjeta').map(cardLabel), deudas = list('deuda').map(debtLabel);
    let pool;
    if (key === 'origen') pool = f.tipo === 'Gasto' ? [...cuentas, ...tarjetas, ...terc] : [...cuentas, ...terc];
    else pool = f.tipo === 'Pago deuda' ? [...tarjetas, ...deudas] : [...cuentas, ...terc];
    const uses = movs.filter(m => m.tipo === f.tipo).map(m => key === 'origen' ? m.origen : (m.destino || (m.tipo === 'Ingreso' ? m.origen : '')));
    return byUse(pool, uses);
  }
  if (kind === 'mov' && key === 'categoria'){
    const same = movs.filter(m => m.tipo === f.tipo);
    const base = f.tipo === 'Ingreso' ? [...same.map(m => m.categoria), 'Honorarios','Otros'] : [...same.map(m => m.categoria), ...options('cats')];
    return byUse(base, same.map(m => m.categoria));

function descSuggestions(f){

function shortcuts(){
  const g = new Map();
  for (const m of list('mov')){
    if (m.tipo !== 'Gasto' || !m.descripcion || isProjCat(m.categoria)) continue;
    const k = norm(m.descripcion);
    const e = g.get(k) || {n:0, last:null};
    e.n++; if (!e.last || (m.fecha||'') >= (e.last.fecha||'')) e.last = m;
    g.set(k, e);
  }
  return [...g.values()].filter(e => e.n >= 2).sort((a,b) => b.n - a.n || (b.last.fecha||'').localeCompare(a.last.fecha||'')).slice(0, 8).map(e => e.last);
}

const DEFAULT_SHEET = '';
const XLSX_MIME = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
const sheetIdFrom = s => { const m = String(s||'').match(/\/d\/([A-Za-z0-9_-]{20,})/); return m ? m[1] : (/^[A-Za-z0-9_-]{20,}$/.test(String(s||'').trim()) ? String(s).trim() : ''); };
function parseWorkbook(wb){
  const sheets = {};
  for (const name of wb.SheetNames){
    const a = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, raw:true, defval:''});
    if (!a.length) continue;
    const hdr = a[0].map(norm);
    sheets[norm(name)] = a.slice(1).map(r => Object.fromEntries(hdr.map((k,i) => [k, r[i]]))).filter(o => Object.values(o).some(v => v !== '' && v != null));
  }
  const S = n => sheets[n] || [];
  const out = [];
  const push = (kind, o) => out.push({kind, ...o});
  for (const r of S('movimientos')){
    if (!num(r.monto) && !str(r.fecha)) continue;
    const moneda = str(r.moneda).toUpperCase() || 'PYG';
    push('mov', {fecha: toISO(r.fecha), tipo: str(r.tipo) || 'Gasto', categoria: str(r.categoria), subcategoria: str(r.subcategoria), descripcion: str(r.descripcion),
      origen: str(r.origen), destino: str(r.destino), moneda, monto: num(r.monto), tc: moneda === 'PYG' ? 1 : num(r.tc_gs), notas: str(r.notas)});
  }
  for (const r of S('cuentas')){
    if (!str(r.cuenta) && !str(r.banco)) continue;
    const notas = str(r.notas);
    push('cuenta', {banco: str(r.banco), cuenta: str(r.cuenta), moneda: str(r.moneda).toUpperCase() || 'PYG',
      saldo_inicial: r.saldo_final_gs !== '' && r.saldo_final_gs != null ? num(r.saldo_final_gs) : num(r.saldo_inicial_gs),
      fecha_base: toISO(r.fecha_base), terceros: /tercer/i.test(notas), notas});
  }
  for (const r of S('tarjetas')){
    if (!str(r.banco)) continue;
    push('tarjeta', {banco: str(r.banco), tarjeta: str(r.tarjeta), moneda: str(r.moneda).toUpperCase() || 'PYG', saldo: num(r.saldo_facturado),
      fecha_base: TODAY, vencimiento: toISO(r.vencimiento), pago_minimo: num(r.cuota_proxima) || '', notas: str(r.notas)});
  }
  for (const r of S('deudas')){
    if (!str(r.concepto) && !num(r.saldo_pendiente_gs)) continue;
    let tasa = r.tasa_anual; tasa = typeof tasa === 'number' && tasa < 1 ? tasa * 100 : num(tasa);
    push('deuda', {entidad: str(r.entidad), concepto: str(r.concepto), moneda: str(r.moneda).toUpperCase() || 'PYG', capital_inicial: num(r.capital_inicial),
      tasa, cuota: num(r.cuota), saldo: num(r.saldo_pendiente_gs), vencimiento: toISO(r.vencimiento), notas: str(r.notas)});
  }
  for (const r of S('inversiones')){
    if (!str(r.activo)) continue;
    const moneda = str(r.moneda).toUpperCase() || 'PYG'; const notas = str(r.notas);
    let valor = num(r.valor_gs) || num(r.cantidad) * num(r.precio_gs);
    if (moneda === 'USD' && !valor){ const m = notas.match(/USD\s*([\d.,]+)/i); if (m) valor = num(m[1]); }
    push('inversion', {activo: str(r.activo), entidad: str(r.entidad), moneda, valor, fecha: toISO(r.fecha_valoracion), notas});
  }
  for (const r of S('presupuesto')){
    if (!str(r.categoria)) continue;
    const mes = typeof r.mes === 'number' ? toISO(r.mes).slice(0,7) : str(r.mes).slice(0,7);
    if (!num(r.limite_gs)) continue;
    push('presupuesto', {categoria: str(r.categoria), mes, limite: num(r.limite_gs)});
  }
  for (const r of S('metas')){ if (str(r.objetivo)) push('meta', {objetivo: str(r.objetivo), fecha_meta: toISO(r.fecha_meta), monto: num(r.monto_gs), ahorrado: num(r.ahorrado_gs)}); }
  for (const r of S('cuentas_por_cobrar')){
    if (!str(r.cliente_origen)) continue;
    push('cobro', {cliente: str(r.cliente_origen), periodo: str(r.periodo_devengado), monto: num(r.monto_gs), fecha_factura: toISO(r.fecha_factura),
      vencimiento: toISO(r.vencimiento_estimado), estado: str(r.estado), fecha_cobro: toISO(r.fecha_de_cobro), notas: str(r.observacion)});
  }
  for (const r of S('calendario_financiero')){
    if (!str(r.concepto) && !str(r.entidad)) continue;
    const raw = r.fecha_periodo; const f = toISO(raw);
    push('evento', {fecha: f, fecha_texto: f ? '' : str(raw), entidad: str(r.entidad), concepto: str(r.concepto), monto_gs: num(r.monto_gs), monto_usd: num(r.monto_usd),
      estado: str(r.estado), tipo: str(r.tipo) || 'Salida', notas: str(r.observacion)});
  }
  for (const r of S('ingresos_y_escenarios')){
    if (!str(r.fuente)) continue;
    push('ingreso', {fuente: str(r.fuente), detalle: str(r.detalle), monto: num(r.monto_gs_mensual), tipo: str(r.tipo), estado: str(r.estado), fecha_cobro: str(r.fecha_de_cobro), notas: str(r.notas)});
  }
  for (const r of S('gastos_recurrentes')){
    if (!str(r.concepto)) continue;
    push('recurrente', {concepto: str(r.concepto), grupo: str(r.grupo), monto_pyg: num(r.monto_pyg), monto_usd: num(r.monto_usd), frecuencia: str(r.frecuencia) || 'Mensual',
      quien: str(r.quien_soporta), notas: [str(r.tratamiento_vencimiento), str(r.hasta) ? 'Hasta: ' + str(r.hasta) : ''].filter(Boolean).join(' · ')});
  }
  for (const r of S('conciliacion')){ if (str(r.concepto)) push('pendiente', {estado: str(r.estado) || 'Pendiente', concepto: str(r.concepto), detalle: str(r.pendiente_de_conciliar)}); }
  return out;
}
function handleWorkbook(wb, source){

function fromFile(file){

  fr.onerror = () => { state.importBusy = ''; toast('No pude leer ese archivo.'); render(); };
  fr.readAsArrayBuffer(file);
}
async function runPool(tasks, n, onTick){
  let i = 0, done = 0;
  const worker = async () => { while (i < tasks.length){ const t = tasks[i++]; await withRetry(t); done++; onTick(done); } };
  await Promise.all(Array.from({length: Math.min(n, tasks.length)}, worker));
}
async function applyImport(){
  const {data} = state.importPreview;
  const old = [...items.keys()];
  const total = old.length + data.length;
  const tick = d => { state.importBusy = `Guardando… ${Math.round(d/total*100)}%`; renderSoon(); };
  try {
    state.importBusy = 'Guardando…'; render();
    if (persistent){
      let d = 0;
      await runPool(old.map(id => () => itemsCol.doc(id).delete()), 4, () => tick(++d));
      await runPool(data.map(o => () => itemsCol.doc().set(o)), 4, () => tick(++d));
    } else { await commitMutation(()=>{items.clear(); for (const o of data) items.set(newId(), o);}); }
    await saveSettings({lastImport: new Date().toISOString()});
    state.importPreview = null; state.importBusy = ''; toast(`Importados ${data.length} registros.`); go('resumen');
  } catch (e){ state.importBusy = ''; toast(dbError(e)); render(); }
}
async function wipeAll(){

function offerFile(filename, data){

// Respaldo cifrado: PBKDF2-SHA-256 (600.000 iteraciones) + AES-256-GCM.
// Web Crypto exige HTTPS o localhost; nunca se degrada a texto plano.
function secureCrypto(){
  if (!window.isSecureContext || !crypto || !crypto.subtle) {
    alert('El cifrado requiere una dirección HTTPS segura. No funciona desde la dirección HTTP de Windows. No se creó ningún respaldo.');
    return false;
  }
  return true;
}
function bytes64(bytes){
  let s=''; for (let i=0;i<bytes.length;i+=8192) s+=String.fromCharCode(...bytes.subarray(i,i+8192));
  return btoa(s);
}
function from64(s){
  const t=atob(s); return Uint8Array.from(t,c=>c.charCodeAt(0));
}
async function deriveBackupKey(password,salt,usage){
  const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,[usage]);
}
async function exportEncrypted(){
  if (vaultLocked || vaultClosing || !vaultKey) return;
  if (!secureCrypto()) return;
  const password=prompt('Creá una contraseña para este respaldo (mínimo 12 caracteres). Guardala en un lugar seguro: sin ella no podremos recuperar los datos.');
  if (password===null) return;
  if (password.length<12){ alert('La contraseña debe tener al menos 12 caracteres.'); return; }
  const again=prompt('Repetí la contraseña del respaldo:');
  if (again!==password){ alert('Las contraseñas no coinciden. No se creó ningún archivo.'); return; }
  try {
    const backupGeneration=vaultGeneration;
    // El respaldo debe representar un estado ya guardado, no cambios pendientes.
    await mutationQueue;
    await vaultQueue;
    if (vaultSaveError) throw Error('Hay un guardado fallido. No se creó un respaldo potencialmente inconsistente.');
    if(vaultLocked || vaultClosing || backupGeneration!==vaultGeneration) throw Error('Se bloqueó la bóveda. Reintentá el respaldo.');
    const salt=crypto.getRandomValues(new Uint8Array(16));
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const key=await deriveBackupKey(password,salt,'encrypt');
    if(vaultLocked || vaultClosing || backupGeneration!==vaultGeneration) throw Error('Se bloqueó la bóveda. Reintentá el respaldo.');
    const backup={format:'mar-finanzas-backup',version:2,exportado:new Date().toISOString(),items:[...items],boda:[...boda],settings};
    const encrypted=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(backup)));
    const envelope={format:'mar-finanzas-encrypted',version:1,kdf:'PBKDF2-SHA256',iterations:600000,cipher:'AES-256-GCM',salt:bytes64(salt),iv:bytes64(iv),data:bytes64(new Uint8Array(encrypted))};
    if(vaultLocked || vaultClosing || backupGeneration!==vaultGeneration) throw Error('Se bloqueó la bóveda. Reintentá el respaldo.');
    offerFile(`mar-finanzas-cifrado-${TODAY}.mfin`,JSON.stringify(envelope));
  }catch(e){alert('No se pudo cifrar el respaldo: '+e.message);}
}
async function importEncrypted(file){
  if (!file || !secureCrypto()) return;
  try{
    if(file.size>15*1024*1024) throw Error('Archivo demasiado grande.');
    const env=JSON.parse(await file.text());
    if(env.format!=='mar-finanzas-encrypted'||env.version!==1||env.iterations!==600000||env.kdf!=='PBKDF2-SHA256'||env.cipher!=='AES-256-GCM') throw Error('Formato cifrado no reconocido.');
    const salt=from64(env.salt),iv=from64(env.iv),data=from64(env.data);
    if(salt.length!==16||iv.length!==12||data.length<16) throw Error('Archivo cifrado inválido.');
    const password=prompt('Contraseña de este respaldo:');
    if(password===null) return;
    const importGeneration=vaultGeneration;
    const key=await deriveBackupKey(password,salt,'decrypt');
    if(vaultLocked || vaultClosing || importGeneration!==vaultGeneration) throw Error('Se bloqueó la bóveda durante la importación.');
    let decrypted;
    try { decrypted=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,data); }
    catch { throw Error('Contraseña incorrecta o archivo dañado.'); }
    const obj=JSON.parse(new TextDecoder().decode(decrypted));
    if(vaultLocked || vaultClosing || importGeneration!==vaultGeneration) throw Error('Se bloqueó la bóveda durante la importación.');
    const asFile=new File([JSON.stringify(obj)],'respaldo-descifrado.json',{type:'application/json'});
    await importBackupFile(asFile);
  }catch(e){alert('No se pudo restaurar el respaldo cifrado: '+e.message);}
}
async function importBackupFile(file){
  if (!file) return;
  try {
    if (file.size > 10*1024*1024) throw Error('El archivo supera 10 MB.');
    const readGeneration=vaultGeneration;
    const data = JSON.parse(await file.text());
    if(vaultLocked || vaultClosing || readGeneration!==vaultGeneration) throw Error('La sesión se bloqueó mientras se leía el archivo.');
    if (data.format !== 'mar-finanzas-backup' || data.version !== 2 ||
        !Array.isArray(data.items) || !Array.isArray(data.boda) ||
        !data.settings || typeof data.settings !== 'object' || Array.isArray(data.settings))
      throw Error('El archivo no tiene el formato de respaldo de esta versión.');
    const validEntries = a => a.length <= 20000 && a.every(e => Array.isArray(e) && e.length === 2 &&
      typeof e[0] === 'string' && e[1] && typeof e[1] === 'object' && !Array.isArray(e[1]));
    if (!validEntries(data.items) || !validEntries(data.boda)) throw Error('Los registros no son válidos.');
    if (!confirm(`Respaldo: ${data.items.length} registros y ${data.boda.length} registros extra.\n\nIMPORTANTE: esto reemplazará todos los datos actuales de esta app en este navegador. ¿Continuar?`)) return;
    if(vaultLocked || vaultClosing) throw Error('Primero desbloqueá la bóveda.');
    await mutationQueue; // Evitar mutaciones concurrentes antes de restaurar.
    await vaultQueue;
    if(vaultLocked || vaultClosing || readGeneration!==vaultGeneration) throw Error('La sesión cambió durante la restauración.');
    const previous=vaultPayload();
    const restoreGeneration=vaultGeneration;
    try {
      if(restoreGeneration!==vaultGeneration || vaultClosing || vaultLocked) throw Error('La sesión cambió durante la restauración.');
      await commitMutation(()=>applyVaultPayload(JSON.stringify({items:data.items,boda:data.boda,settings:data.settings})));
      toast('Respaldo restaurado y cifrado. Revisá los movimientos.'); go('resumen');
    } catch(e){if(restoreGeneration===vaultGeneration && !vaultLocked && !vaultClosing) applyVaultPayload(previous);throw e;}

  } catch(e) { alert('No se pudo importar el respaldo: '+e.message); }
}

function vAjustes(){
  const out = [];
  const tcInput = h('input',{id:'tc-in', class:'field', type:'text', inputmode:'decimal', placeholder:'Ej. 7.300', value: settings.tc ? nf0.format(num(settings.tc)) : ''});
  out.push(panel('Tipo de cambio', null,
    h('p',{class:'note', style:'margin-top:0'},'Guaraníes por dólar. Se usa para pasar a Gs. las cuentas, inversiones y movimientos en USD. Si lo dejás vacío, los montos en dólares se muestran aparte.'),
    h('div',{class:'toolbar'}, h('label',{for:'tc-in', class:'small muted'},'Gs. por USD'), tcInput,
      h('button',{type:'button', class:'btn primary', onclick: async () => { try { await saveSettings({tc: num(tcInput.value) || ''}); toast('Tipo de cambio guardado'); } catch(e){ toast(dbError(e)); } }}, 'Guardar'))));

  out.push(panel('Tus datos', null,
    h('p',{class:'note', style:'margin-top:0'}, persistent ? 'Los datos se guardan en este navegador.' : 'Bóveda cifrada en este navegador. Versión de prueba: usá únicamente movimientos ficticios y mantené respaldos .mfin.'),
    h('div',{class:'toolbar'},
      h('button',{type:'button', class:'btn primary', onclick: exportEncrypted}, 'Crear respaldo cifrado (.mfin)'),
      h('input',{id:'encrypted-backup-file',type:'file',accept:'.mfin',hidden:true,onchange:e=>{importEncrypted(e.target.files[0]);e.target.value='';}}),
      h('button',{type:'button',class:'btn',onclick:()=>document.getElementById('encrypted-backup-file').click()},'Restaurar respaldo cifrado (.mfin)'),
      state.confirmWipe
        ? [h('button',{type:'button', class:'btn danger', onclick: wipeAll}, `Sí, borrar ${items.size} registros`), h('button',{type:'button', class:'btn', onclick:() => { state.confirmWipe = false; render(); }}, 'Cancelar')]
        : h('button',{type:'button', class:'btn danger', disabled: !items.size, onclick:() => { state.confirmWipe = true; render(); }}, 'Borrar todo'))));
  return out;
}

/* ---------- navegación y render ---------- */
const TABS = [['resumen','Resumen'],['movs','Movimientos'],['pres','Presupuesto'],['cobros','Cobros'],['cuentas','Cuentas'],['boda','Boda']];
const VIEWS = {resumen:vResumen, movs:vMovs, pres:vPres, cobros:vCobros, cuentas:vCuentas, boda:vBoda, ajustes:vAjustes};
function go(tab){ if(vaultLocked || vaultClosing)return; state.tab = tab; lsSet('tab', tab); render(); window.scrollTo({top:0}); }
let raf = 0;
function renderSoon(){ cancelAnimationFrame(raf); raf = requestAnimationFrame(doRender); }
const render = renderSoon;
function doRender(){
  if (vaultLocked || vaultClosing) return;
  if (!VIEWS[state.tab]) state.tab = 'resumen';
  const tabs = $('#tabs');
  tabs.replaceChildren(...TABS.map(([k,l]) => h('button',{type:'button', 'aria-current': state.tab === k ? 'page' : null, onclick:() => go(k)}, svg(ICONS[k === 'boda' ? projIconKey() : k]), h('span',null, k === 'boda' ? (projName().length > 11 ? 'Extra' : projName()) : l))));
  $('#btn-ajustes').setAttribute('aria-pressed', String(state.tab === 'ajustes'));
  const a = document.activeElement; const fid = a && a.id && $('#view').contains(a) ? a.id : null;
  const sel = fid && 'selectionStart' in a ? [a.selectionStart, a.selectionEnd] : null;
  const view = $('#view');
  if (!loaded){ view.replaceChildren(h('div',{class:'empty'}, 'Cargando tus datos…')); return; }
  view.replaceChildren(...[null, ...VIEWS[state.tab]()].filter(Boolean));
  if (fid){ const el = document.getElementById(fid); if (el){ el.focus(); if (sel) try { el.setSelectionRange(sel[0], sel[1]); } catch {} } }
  $('#fab').hidden = state.tab === 'ajustes';
}
$('#btn-ajustes').addEventListener('click', () => go(state.tab === 'ajustes' ? 'resumen' : 'ajustes'));
$('#fab').addEventListener('click', () => openForm('mov'));
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
/* ---------- inicio limpio: sin movimientos precargados ---------- */
function demoBoot(){
  persistent = false; loaded = true; bodaOK = true;
  settings = {};
  loaded=false; setSync('Bóveda bloqueada','warn'); showVault();
}
demoBoot();
